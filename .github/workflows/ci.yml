name: Living pets quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run verify
  escrow:
    # Escrow contract (Boing VM bytecode builder) on the pinned boing.network
    # interpreter: behaviour tests, committed bytecode and ABI vector drift.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts/escrow
      - run: cargo fmt --manifest-path contracts/escrow/Cargo.toml --check
      - run: cargo test --locked --manifest-path contracts/escrow/Cargo.toml
  windows: # Desktop packaging runs on Windows players' machines: prove Prisma
    # migrations, embedded Postgres and the test suite work there too.
    # Formatting is checked on Linux only (Windows checkouts use CRLF).
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run db:generate
      - run: npm run typecheck
      - run: npm run test
      - run: npm run desktop:build
      # Hosted Windows runners run as an administrator, and Postgres refuses
      # to start under an admin account, so the smoke uses the runner's
      # preinstalled Postgres service (CI-only default credentials) instead
      # of embedded Postgres. It still exercises migrateDeploy on Windows.
      - name: Start the runner's Postgres
        shell: pwsh
        run: |
          $pg = Get-Service -Name 'postgresql*' | Select-Object -First 1
          Set-Service -Name $pg.Name -StartupType Manual
          Start-Service -Name $pg.Name
      - run: npm run desktop:smoke
        env:
          LIVING_PETS_SMOKE_DATABASE_URL: postgresql://postgres:root@localhost:5432/postgres?schema=living_pets_smoke
