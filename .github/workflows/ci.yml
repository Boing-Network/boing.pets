name: Pets quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run types:generate
      - run: npm run verify
      - run: npm run db:local
      - run: npx wrangler deploy --dry-run --outdir .wrangler/dry-run
