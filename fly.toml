# Fly.io app for the shared-world server (one always-on machine).
# Deploy: npm run fly:deploy  (see README "Hosting on Fly.io").
app = "boing-living-pets"
primary_region = "iad"
# serve.ts saves the world on SIGTERM; give it time before a hard kill.
kill_signal = "SIGTERM"
kill_timeout = "30s"

[build]
  dockerfile = "Dockerfile"

[deploy]
  # Applies Prisma migrations against DATABASE_URL before new code starts.
  release_command = "npx prisma migrate deploy"
  # One machine, updated in place: never two writers on the same world.
  strategy = "rolling"

[env]
  NODE_ENV = "production"
  PORT = "8080"
  LIVING_PETS_MP_HOST = "0.0.0.0"
  # Speed for a brand-new world only; the owner can change it later.
  LIVING_PETS_MP_SCALE = "1"
  # Marketplace: operator wallet that holds NFTs until a player adopts or claims
  # them (public address). LIVING_PETS_ESCROW_HEX stays unset until a real
  # escrow contract is deployed.
  LIVING_PETS_OPERATOR_HEX = "0xc8b386c732a9f00c7ccd28aa4a8c377634057d6b5604099f4809a8fee58af6f8"
  # Boing testnet (6913) minting. The operator seed is the BOING_SECRET_HEX
  # secret; the collections below were deployed by the operator.
  LIVING_PETS_BOING_MINTING = "1"
  LIVING_PETS_BOING_NFT_COLLECTION_HEX = "0x9aebaf44c0151b58be361aa1b4e4d02dbe9922e6f33c7ef3bdb2fb5832b51701"
  LIVING_PETS_BOING_ARTIFACT_COLLECTION_HEX = "0x95cf68bc73ec4d842ba2c5765eccd424aa2d7fe913627fa70efeb321cb2cdcea"
  # Mint the founders as the genesis set on boot (idempotent; safe to leave on).
  LIVING_PETS_BOING_GENESIS_MINT = "1"
  # Browser origins allowed to open the WebSocket. `*` = letters/digits/dashes.
  # Boing wallets (0x + 64 hex, comma-separated) that sign in as owner.
  # LIVING_PETS_MP_OWNER_WALLETS = "0x…"
  LIVING_PETS_MP_ALLOWED_ORIGINS = "https://boing-pets-*-nico-builds.vercel.app,https://boing-pets.vercel.app,http://localhost:*,http://127.0.0.1:*"

[http_service]
  internal_port = 8080
  force_https = true
  # The world keeps ticking with nobody connected.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/healthz"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
